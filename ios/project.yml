name: PlugAndPlay
options:
  bundleIdPrefix: com.plugandplay
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  PlugAndPlay:
    type: application
    platform: iOS
    sources:
      - path: PlugAndPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plugandplay.PlugAndPlay
        INFOPLIST_FILE: PlugAndPlay/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: X9D7HQ8K3K
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
