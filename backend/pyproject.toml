[project]
name = "plug-and-play-backend"
version = "0.1.0"
description = "Backend for tamper-proof self-capture insurance underwriting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "anthropic>=0.92",
  "opencv-python-headless>=4.10",
  "imageio-ffmpeg>=0.5",
  "faster-whisper>=1.0",
  "numpy>=2.0",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
